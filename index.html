<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>LAN3003 智能反思表批改系統</title>
    <!-- 引入 SheetJS 處理 Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; padding: 20px; max-width: 800px; margin: auto; background-color: #f4f7f6; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; font-size: 24px; }
        .btn { background-color: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 15px; }
        .btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .btn-success { background-color: #2ecc71; }
        #logArea { width: 100%; height: 200px; margin-top: 20px; padding: 10px; border: 1px solid #ccc; background: #f9f9f9; overflow-y: scroll; font-size: 14px; }
        .progress-bar { width: 100%; background-color: #e0e0e0; border-radius: 5px; margin-top: 15px; overflow: hidden; }
        .progress { height: 20px; background-color: #2ecc71; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 LAN3003 智能反思表批改系統 (脫敏安全版)</h1>
    <p>請先填寫您的 GAS 應用程式網址，然後上傳 <code>AI 評分TEST.xlsx</code> 試卷檔案。系統將自動過濾所有個資，僅傳送系統代號 (Id) 與作答內容進行 AI 評核。</p>
    
    <label for="gasUrl"><b>GAS Web App 網址：</b></label><br>
    <input type="text" id="gasUrl" placeholder="https://script.google.com/macros/s/..." style="width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box;">
    
    <input type="file" id="fileUpload" accept=".xlsx, .xls" />
    <button id="startBtn" class="btn" disabled>🚀 開始智能批改</button>
    <button id="downloadBtn" class="btn btn-success" style="display:none;">📥 下載批改結果</button>

    <div class="progress-bar"><div id="progress" class="progress"></div></div>
    <textarea id="logArea" readonly placeholder="系統日誌將顯示於此..."></textarea>
</div>

<script>
    let globalWorkbook = null;
    let originalData = [];
    let sheetName = "";

    // 題目欄位定義 (與 Excel 完全對應)
    const colUsedAI = "你在準備情景對話時，有沒有使用任何生成式 AI 工具？";
    const colQ5 = "你使用了甚麼生成式 AI 工具？你主要希望它在哪些方面提供協助？";
    const colQ6 = "在過程中，你採用了哪些生成式 AI 的建議？哪些建議沒有採用？請各舉一例，並說明原因。（50至100字）";
    const colQ7 = "你拿到資料卡後，採用了甚麼方法準備這次情景對話？";
    const colQ8 = "準備時，以下哪一項對你而言最具挑戰性？\n";
    const colQ9 = "就你在上一題所選的項目而言，為甚麼沒有尋求生成式 AI 的協助？（50至100字）\n";
    const colQ10 = "使用生成式 AI 完成作業或準備評核時，請列舉兩個需要注意的事項，並分別說明原因。（80至120字）";
    const colQ11 = "請舉出一個你將來會應用生成式 AI 協助語文學習的具體例子，並說明原因。（80至120字）\n";

    document.getElementById('fileUpload').addEventListener('change', function(e) {
        let reader = new FileReader();
        reader.onload = function(e) {
            let data = new Uint8Array(e.target.result);
            globalWorkbook = XLSX.read(data, {type: 'array'});
            sheetName = globalWorkbook.SheetNames[0];
            originalData = XLSX.utils.sheet_to_json(globalWorkbook.Sheets[sheetName], {defval: ""});
            document.getElementById('startBtn').disabled = false;
            log("📄 檔案讀取成功，共 " + originalData.length + " 筆資料。");
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    document.getElementById('startBtn').addEventListener('click', async function() {
        let gasUrl = document.getElementById('gasUrl').value.trim();
        if(!gasUrl) { alert("請先填寫 GAS 網址！"); return; }
        
        this.disabled = true;
        document.getElementById('downloadBtn').style.display = "none";
        log("🚀 開始批改，執行資料脫敏程序...");

        for(let i = 0; i < originalData.length; i++) {
            let row = originalData[i];
            
            // 🔒 【核心資安機制：資料脫敏】只提取無意義的 Id 與答題內容
            let safeData = {
                id: row["Id"] || `未知ID_${i}`,
                usedAI: String(row[colUsedAI]).trim(),
                q5: String(row[colQ5]).trim(),
                q6: String(row[colQ6]).trim(),
                q7: String(row[colQ7]).trim(),
                q8: String(row[colQ8]).trim(),
                q9: String(row[colQ9]).trim(),
                q10: String(row[colQ10]).trim(),
                q11: String(row[colQ11]).trim()
            };

            log(`[${safeData.id}] 正在分析作答...`);
            let prompt = buildPrompt(safeData);

            try {
                // 呼叫 GAS 中轉站
                let response = await fetch(gasUrl, {
                    method: 'POST',
                    body: JSON.stringify({ prompt: prompt })
                });
                let resultText = await response.text();
                
                // 嘗試解析 AI 回傳的 JSON 格式分數與評語
                let resultObj = JSON.parse(resultText);
                
                // 將結果寫回 originalData (這只在瀏覽器記憶體中進行)
                if(safeData.usedAI === "有") {
                    row[`Points - ${colQ5}`] = resultObj.path_points;
                    row[`Feedback - ${colQ5}`] = resultObj.path_feedback;
                } else {
                    row[`Points - ${colQ7}`] = resultObj.path_points;
                    row[`Feedback - ${colQ7}`] = resultObj.path_feedback;
                }
                row[`Points - ${colQ10}`] = resultObj.common_points;
                row[`Feedback - ${colQ10}`] = resultObj.common_feedback;

                log(`[${safeData.id}] 批改完成。`);

            } catch (error) {
                log(`[${safeData.id}] ❌ 批改發生錯誤：${error.message}`);
            }

            // 更新進度條
            document.getElementById('progress').style.width = ((i + 1) / originalData.length * 100) + "%";
            
            // 延遲 1 秒，避免觸發 API 或 GAS 頻率限制
            await new Promise(r => setTimeout(r, 1000));
        }

        log("✅ 所有試卷批改完畢！可以下載檔案了。");
        document.getElementById('downloadBtn').style.display = "inline-block";
        document.getElementById('startBtn').disabled = false;
    });

    document.getElementById('downloadBtn').addEventListener('click', function() {
        let newWorksheet = XLSX.utils.json_to_sheet(originalData);
        let newWorkbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(newWorkbook, newWorksheet, sheetName);
        XLSX.writeFile(newWorkbook, "AI_評分TEST_批改完成.xlsx");
        log("📥 檔案已觸發下載。");
    });

    function log(msg) {
        let textarea = document.getElementById('logArea');
        textarea.value += msg + "\n";
        textarea.scrollTop = textarea.scrollHeight;
    }

    // 構建傳送給 AI 的提示詞，明確要求不猜測個資，並嚴格遵循 JSON 輸出格式
    function buildPrompt(data) {
        let isPathA = (data.usedAI === "有");
        
        let promptText = `你是一名香港的大學講師，正在批改「LAN3003職業中文傳意」的反思表。
【最高指導原則】你收到的是一份已脫敏的作答文本，系統代號為 ${data.id}。請直接根據評分標準給出回饋與分數，絕對不要試圖猜測學生身分，也不要生成任何涉及個人的問候語。

【作答內容】
`;
        if (isPathA) {
            promptText += `學生表示「有」使用 AI。
第5題 (使用工具及協助方面)：${data.q5}
第6題 (採用/不採用建議及原因)：${data.q6}
`;
        } else {
            promptText += `學生表示「沒有」使用 AI。
第7題 (準備方法)：${data.q7}
第8題 (挑戰)：${data.q8}
第9題 (為何沒用AI)：${data.q9}
`;
        }
        promptText += `第10題 (兩項注意事項及原因)：${data.q10}
第11題 (未來應用例子)：${data.q11}

【評分標準】
`;
        if (isPathA) {
            promptText += `路徑A (第5-6題，滿分5分)：
優/良(4-5分)：第5題寫出工具名稱並清晰交代協助方面(佔2分)；第6題各舉一「採用」及「不採用」建議並說明原因，原因須連繫本次情景(佔3分)。
尚可(2-3分)：未交代協助方面；第6題只答單面或原因空泛。
弱/不足(0-1分)：只寫工具名稱，或虛構/全部採用。
`;
        } else {
            promptText += `路徑B (第7-9題，滿分5分)：
優/良(4-5分)：第7題列出具體做法(佔2分)；第9題根據第8題選項說明不尋求協助原因並連繫任務(佔3分)。
尚可(2-3分)：第7題空泛；第8與第9題邏輯不一致。
弱/不足(0-1分)：只寫「沒問題」等；或第7題與第9題互抄(互抄最多1分)。
`;
        }
        
        promptText += `全體共通題 (第10-11題，滿分5分)：
優/良(4-5分)：第10題列出兩項注意事項、分別說明原因並連繫評核(佔3分)；第11題提出具體可執行做法且不重複(佔2分)。
尚可(2-3分)：第10題原因簡略；第11題空泛無步驟。
弱/不足(0-1分)：未能寫出注意事項；皆空泛。

【輸出要求】
請你「務必」只輸出純 JSON 格式，不要包含 \`\`\`json 標籤或其他文字。格式如下：
{
  "path_points": X,
  "path_feedback": "對於路徑的具體評語...",
  "common_points": Y,
  "common_feedback": "對於10-11題的具體評語..."
}
`;
        return promptText;
    }
</script>

</body>
</html>
