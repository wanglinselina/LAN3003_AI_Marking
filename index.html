<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>LAN3003 AI 反思表批改系統</title>
    <!-- 升級為 ExcelJS，支援字體顏色與樣式寫入 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --accent-hover: #2980b9;
            --success-color: #27ae60;
            --success-hover: #2ecc71;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #7f8c8d;
        }

        body {
            font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 30px 40px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 10px 0;
            font-size: 26px;
            letter-spacing: 1px;
        }

        .header p {
            margin: 0;
            font-size: 14px;
            color: #ecf0f1;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .upload-area {
            border: 2px dashed #bdc3c7;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            background-color: #fafbfc;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }
        
        .upload-area:hover {
            border-color: var(--accent-color);
            background-color: #f1f8ff;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .file-label:hover {
            background-color: var(--accent-hover);
        }

        #fileName {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-primary { background-color: var(--primary-color); }
        .btn-primary:hover:not(:disabled) { background-color: #1a252f; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(44,62,80,0.2); }
        
        .btn-success { background-color: var(--success-color); display: none; }
        .btn-success:hover { background-color: var(--success-hover); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(39,174,96,0.2); }

        .progress-wrapper {
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 8px;
            height: 12px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background-color: var(--success-color);
            width: 0%;
            transition: width 0.4s ease;
        }

        .console-log {
            width: 100%;
            height: 250px;
            padding: 15px;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            background: #2b2b2b;
            color: #a9b7c6;
            font-family: "Consolas", monospace;
            font-size: 13px;
            overflow-y: auto;
            box-sizing: border-box;
            line-height: 1.6;
        }
        
        .status-header {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>📝 LAN3003 AI 反思表批改系統</h1>
        <p>安全、脫敏、全自動的學生反思表智能分析平台</p>
    </div>
    
    <div class="content">
        <div class="upload-area">
            <label for="fileUpload" class="file-label">
                <i class="icon">📁</i> 選擇 Excel 試卷檔案
            </label>
            <input type="file" id="fileUpload" accept=".xlsx, .xls" />
            <span id="fileName">尚未選擇檔案 (請上傳 AI 評分TEST.xlsx 格式)</span>
        </div>

        <div class="action-buttons">
            <button id="startBtn" class="btn btn-primary" disabled>🚀 開始智能批改</button>
            <button id="downloadBtn" class="btn btn-success">📥 下載批改完成檔案</button>
        </div>

        <div class="progress-wrapper">
            <div class="status-header">
                <span>系統執行進度</span>
                <span id="progressText">0%</span>
            </div>
            <div class="progress-bar"><div id="progress" class="progress"></div></div>
        </div>

        <!-- 改為 DIV 結構以支援網頁彩色日誌顯示 -->
        <div id="logArea" class="console-log">系統準備就緒...</div>
    </div>
</div>

<script>
    // =========================================================================
    // ⚙️ 系統設定區：請將您部署好的 GAS 網址貼在下方引號內
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzlpDMB5FBbzDZqbmUFhz5e17JYL7MWrTZZeCmh6L3qvRgQ6tar69duR49mU59BAJlT/exec"; 
    // =========================================================================

    let globalWorkbook = null;
    let worksheet = null;
    let headers = {};
    let dataRowsCount = 0;

    // 題目欄位定義
    const colUsedAI = "你在準備情景對話時，有沒有使用任何生成式 AI 工具？";
    const colQ5 = "你使用了甚麼生成式 AI 工具？你主要希望它在哪些方面提供協助？";
    const colQ6 = "在過程中，你採用了哪些生成式 AI 的建議？哪些建議沒有採用？請各舉一例，並說明原因。（50至100字）";
    const colQ7 = "你拿到資料卡後，採用了甚麼方法準備這次情景對話？";
    const colQ8 = "準備時，以下哪一項對你而言最具挑戰性？\n";
    const colQ9 = "就你在上一題所選的項目而言，為甚麼沒有尋求生成式 AI 的協助？（50至100字）\n";
    const colQ10 = "使用生成式 AI 完成作業或準備評核時，請列舉兩個需要注意的事項，並分別說明原因。（80至120字）";
    const colQ11 = "請舉出一個你將來會應用生成式 AI 協助語文學習的具體例子，並說明原因。（80至120字）\n";

    // 安全讀取單元格資料的輔助函數
    function getSafeValue(row, colName) {
        let colIndex = headers[colName];
        if (!colIndex) return "";
        let cell = row.getCell(colIndex);
        let val = cell.value;
        if (val === null || val === undefined) return "";
        if (typeof val === 'object' && val.richText) {
            return val.richText.map(rt => rt.text).join('').trim();
        }
        return String(val).trim();
    }

    // 處理檔案上傳與解析 (ExcelJS)
    document.getElementById('fileUpload').addEventListener('change', async function(e) {
        let file = e.target.files[0];
        if (!file) return;
        
        document.getElementById('fileName').innerText = `已選擇：${file.name}`;
        
        try {
            let arrayBuffer = await file.arrayBuffer();
            globalWorkbook = new ExcelJS.Workbook();
            await globalWorkbook.xlsx.load(arrayBuffer);
            worksheet = globalWorkbook.worksheets[0];
            
            // 解析並記錄表頭 (Row 1)
            headers = {};
            worksheet.getRow(1).eachCell((cell, colNumber) => {
                let val = cell.value;
                if(val && val.richText) val = val.richText.map(rt=>rt.text).join('');
                if(val) headers[String(val).trim()] = colNumber;
            });

            // 確保有「總分」這個欄位，若無則在最後自動建立
            if (!headers['總分']) {
                let newCol = worksheet.columnCount + 1;
                let headerCell = worksheet.getCell(1, newCol);
                headerCell.value = '總分';
                headerCell.font = { bold: true };
                headers['總分'] = newCol;
            }
            
            dataRowsCount = worksheet.rowCount - 1; 
            document.getElementById('startBtn').disabled = false;
            log(`[系統] 檔案解析成功，共載入 ${dataRowsCount} 筆學生資料。`);
            log(`[系統] 等待執行批改指令...`);
        } catch (err) {
            log(`[錯誤] 檔案讀取失敗：${err.message}`);
        }
    });

    // 執行批改程序
    document.getElementById('startBtn').addEventListener('click', async function() {
        if(GAS_WEB_APP_URL === "在此處貼上您的_GAS_應用程式網址" || GAS_WEB_APP_URL.trim() === "") {
            alert("系統錯誤：未設定後端中轉網址，請聯繫系統管理員更新原始碼中的 GAS_WEB_APP_URL。");
            return;
        }
        
        this.disabled = true;
        document.getElementById('downloadBtn').style.display = "none";
        log("[系統] 🚀 啟動智能批改引擎，執行嚴格資料脫敏程序...");

        // Row 1 是表頭，所以從 Row 2 開始跑迴圈
        for(let i = 2; i <= worksheet.rowCount; i++) {
            let row = worksheet.getRow(i);
            
            // 讀取 Id，若完全空白則跳過該行
            let currentId = getSafeValue(row, "Id");
            if (!currentId) continue;

            let safeData = {
                id: currentId,
                usedAI: getSafeValue(row, colUsedAI),
                q5: getSafeValue(row, colQ5),
                q6: getSafeValue(row, colQ6),
                q7: getSafeValue(row, colQ7),
                q8: getSafeValue(row, colQ8),
                q9: getSafeValue(row, colQ9),
                q10: getSafeValue(row, colQ10),
                q11: getSafeValue(row, colQ11)
            };

            log(`[處理中] 正在分析流水號 [${safeData.id}] 的作答內容...`);
            let prompt = buildPrompt(safeData);

            try {
                let response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ prompt: prompt })
                });
                let resultText = await response.text();
                let resultObj = JSON.parse(resultText);
                
                let isPathA = (safeData.usedAI === "有");
                let pathPtsCol = isPathA ? `Points - ${colQ5}` : `Points - ${colQ7}`;
                let pathFbkCol = isPathA ? `Feedback - ${colQ5}` : `Feedback - ${colQ7}`;
                let comPtsCol = `Points - ${colQ10}`;
                let comFbkCol = `Feedback - ${colQ10}`;

                // 動態寫入 Excel 儲存格的輔助函數
                function writeCell(colName, value, isRed=false, isBold=false) {
                    let colIdx = headers[colName];
                    if(!colIdx) {
                        colIdx = worksheet.columnCount + 1;
                        worksheet.getCell(1, colIdx).value = colName;
                        worksheet.getCell(1, colIdx).font = { bold: true };
                        headers[colName] = colIdx;
                    }
                    let cell = row.getCell(colIdx);
                    cell.value = value;
                    
                    // 設定樣式：紅色字體、粗體、自動換行
                    cell.font = { 
                        color: isRed ? { argb: 'FFFF0000' } : undefined, 
                        bold: isBold
                    };
                    if (isRed) cell.alignment = { wrapText: true, vertical: 'top' };
                }

                // 寫入獨立得分與紅色評語
                writeCell(pathPtsCol, resultObj.path_points, false, true);
                writeCell(pathFbkCol, resultObj.path_feedback, true, false);
                writeCell(comPtsCol, resultObj.common_points, false, true);
                writeCell(comFbkCol, resultObj.common_feedback, true, false);
                
                // 計算並寫入總分 (紅色粗體)
                let total = (resultObj.path_points || 0) + (resultObj.common_points || 0);
                writeCell('總分', total, true, true);

                // 在網頁 UI 顯示彩色結果摘要
                log(`[完成] 流水號 [${safeData.id}] 批改完成。<br>
                <span style="color:#2ecc71;">&nbsp;&nbsp;↳ 路徑得分：${resultObj.path_points} \vert{} 共通得分：${resultObj.common_points} | </span><b style="color:#ff4757;">總分：${total}</b><br>
                <span style="color:#ff4757; font-size:12px;">&nbsp;&nbsp;↳ 評語預覽：${resultObj.path_feedback.substring(0, 35)}...</span>`, true);

            } catch (error) {
                log(`[錯誤] ❌ 流水號 [${safeData.id}] 發生異常：${error.message}`);
            }

            // 更新視覺進度條 (i-1 是因為從 Row 2 開始)
            let progressPercent = Math.round(((i - 1) / dataRowsCount) * 100);
            document.getElementById('progress').style.width = progressPercent + "%";
            document.getElementById('progressText').innerText = progressPercent + "%";
            
            await new Promise(r => setTimeout(r, 1000));
        }

        log("<br><b>[系統] ✅ 所有試卷分析與評分程序執行完畢！</b>", true);
        document.getElementById('downloadBtn').style.display = "block";
        document.getElementById('startBtn').disabled = false;
        document.getElementById('startBtn').innerText = "🔄 重新批改";
    });

    // 匯出包含樣式的 Excel 檔案
    document.getElementById('downloadBtn').addEventListener('click', async function() {
        log("[系統] 正在封裝資料與紅色樣式格式，準備下載...", false);
        try {
            const buffer = await globalWorkbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "LAN3003_AI反思表_批改完成.xlsx";
            a.click();
            window.URL.revokeObjectURL(url);
            log("[系統] 📥 已成功下載批改結果檔案。", false);
        } catch (e) {
            log(`[錯誤] 下載失敗：${e.message}`);
        }
    });

    // 支援 HTML 的系統日誌打印函數
    function log(msg, isHTML = false) {
        let logArea = document.getElementById('logArea');
        let div = document.createElement('div');
        div.style.marginBottom = "6px";
        if (isHTML) {
            div.innerHTML = msg;
        } else {
            div.innerText = msg;
        }
        logArea.appendChild(div);
        logArea.scrollTop = logArea.scrollHeight;
    }

    // 構建傳送給 AI 的提示詞 (Prompt 保持不變)
    function buildPrompt(data) {
        let isPathA = (data.usedAI === "有");
        let promptText = `你是一名香港的大學講師，正在批改「LAN3003職業中文傳意」的反思表。
【最高指導原則】你收到的是一份已脫敏的作答文本，系統代號為 ${data.id}。請直接根據評分標準給出回饋與分數，絕對不要試圖猜測學生身分，也不要生成任何涉及個人的問候語。

【作答內容】\n`;
        if (isPathA) {
            promptText += `學生表示「有」使用 AI。
第5題 (使用工具及協助方面)：${data.q5}
第6題 (採用/不採用建議及原因)：${data.q6}\n`;
        } else {
            promptText += `學生表示「沒有」使用 AI。
第7題 (準備方法)：${data.q7}
第8題 (挑戰)：${data.q8}
第9題 (為何沒用AI)：${data.q9}\n`;
        }
        promptText += `第10題 (兩項注意事項及原因)：${data.q10}
第11題 (未來應用例子)：${data.q11}\n
【評分標準】\n`;
        if (isPathA) {
            promptText += `路徑A (第5-6題，滿分5分)：
優/良(4-5分)：第5題寫出工具名稱並清晰交代協助方面(佔2分)；第6題各舉一「採用」及「不採用」建議並說明原因，原因須連繫本次情景(佔3分)。
尚可(2-3分)：未交代協助方面；第6題只答單面或原因空泛。
弱/不足(0-1分)：只寫工具名稱，或虛構/全部採用。\n`;
        } else {
            promptText += `路徑B (第7-9題，滿分5分)：
優/良(4-5分)：第7題列出具體做法(佔2分)；第9題根據第8題選項說明不尋求協助原因並連繫任務(佔3分)。
尚可(2-3分)：第7題空泛；第8與第9題邏輯不一致。
弱/不足(0-1分)：只寫「沒問題」等；或第7題與第9題互抄(互抄最多1分)。\n`;
        }
        promptText += `全體共通題 (第10-11題，滿分5分)：
優/良(4-5分)：第10題列出兩項注意事項、分別說明原因並連繫評核(佔3分)；第11題提出具體可執行做法且不重複(佔2分)。
尚可(2-3分)：第10題原因簡略；第11題空泛無步驟。
弱/不足(0-1分)：未能寫出注意事項；皆空泛。\n
【輸出要求】
請你「務必」只輸出純 JSON 格式，不要包含 \`\`\`json 標籤或其他文字。格式如下：
{
  "path_points": X,
  "path_feedback": "對於路徑的具體評語...",
  "common_points": Y,
  "common_feedback": "對於10-11題的具體評語..."
}\n`;
        return promptText;
    }
</script>

</body>
</html>
