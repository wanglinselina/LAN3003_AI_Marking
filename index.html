<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>LAN3003 AI 反思表批改系統</title>
    <!-- 同時引入 SheetJS (負責完美讀取) 與 ExcelJS (負責完美上色匯出) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --accent-hover: #2980b9;
            --success-color: #27ae60;
            --success-hover: #2ecc71;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #7f8c8d;
        }

        body {
            font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 30px 40px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 10px 0;
            font-size: 26px;
            letter-spacing: 1px;
        }

        .header p {
            margin: 0;
            font-size: 14px;
            color: #ecf0f1;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .upload-area {
            border: 2px dashed #bdc3c7;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            background-color: #fafbfc;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }
        
        .upload-area:hover {
            border-color: var(--accent-color);
            background-color: #f1f8ff;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .file-label:hover {
            background-color: var(--accent-hover);
        }

        #fileName {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-primary { background-color: var(--primary-color); }
        .btn-primary:hover:not(:disabled) { background-color: #1a252f; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(44,62,80,0.2); }
        
        .btn-success { background-color: var(--success-color); display: none; }
        .btn-success:hover { background-color: var(--success-hover); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(39,174,96,0.2); }

        .progress-wrapper {
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 8px;
            height: 12px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background-color: var(--success-color);
            width: 0%;
            transition: width 0.4s ease;
        }

        .console-log {
            width: 100%;
            height: 250px;
            padding: 15px;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            background: #2b2b2b;
            color: #a9b7c6;
            font-family: "Consolas", monospace;
            font-size: 13px;
            overflow-y: auto;
            box-sizing: border-box;
            line-height: 1.6;
        }
        
        .status-header {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>📝 LAN3003 AI 反思表批改系統</h1>
        <p>安全、脫敏、全自動的學生反思表智能分析平台</p>
    </div>
    
    <div class="content">
        <div class="upload-area">
            <label for="fileUpload" class="file-label">
                <i class="icon">📁</i> 選擇 Excel 試卷檔案
            </label>
            <input type="file" id="fileUpload" accept=".xlsx, .xls" />
            <span id="fileName">尚未選擇檔案 (請上傳 Excel 格式試卷)</span>
        </div>

        <div class="action-buttons">
            <button id="startBtn" class="btn btn-primary" disabled>🚀 開始智能批改</button>
            <button id="downloadBtn" class="btn btn-success">📥 下載批改完成檔案</button>
        </div>

        <div class="progress-wrapper">
            <div class="status-header">
                <span>系統執行進度</span>
                <span id="progressText">0%</span>
            </div>
            <div class="progress-bar"><div id="progress" class="progress"></div></div>
        </div>

        <div id="logArea" class="console-log">系統準備就緒...</div>
    </div>
</div>

<script>
    // =========================================================================
    // ⚙️ 系統設定區：請將您部署好的 GAS 網址貼在下方引號內
    const GAS_WEB_APP_URL = "在此處貼上您的_GAS_應用程式網址"; 
    // =========================================================================

    let originalData = [];
    let sheetName = "Sheet1";

    // 原始題目欄位定義 (做為預設備用)
    const colUsedAI = "你在準備情景對話時，有沒有使用任何生成式 AI 工具？";
    const colQ5 = "你使用了甚麼生成式 AI 工具？你主要希望它在哪些方面提供協助？";
    const colQ6 = "在過程中，你採用了哪些生成式 AI 的建議？哪些建議沒有採用？請各舉一例，並說明原因。（50至100字）";
    const colQ7 = "你拿到資料卡後，採用了甚麼方法準備這次情景對話？";
    const colQ8 = "準備時，以下哪一項對你而言最具挑戰性？";
    const colQ9 = "就你在上一題所選的項目而言，為甚麼沒有尋求生成式 AI 的協助？（50至100字）";
    const colQ10 = "使用生成式 AI 完成作業或準備評核時，請列舉兩個需要注意的事項，並分別說明原因。（80至120字）";
    const colQ11 = "請舉出一個你將來會應用生成式 AI 協助語文學習的具體例子，並說明原因。（80至120字）";

    // ✨ 模糊比對欄位名稱輔助函數：解決各平台匯出時帶有隱藏空白或換行的問題
    function getExactKey(row, keyword) {
        return Object.keys(row).find(k => k.includes(keyword));
    }

    // 處理檔案上傳 (使用 SheetJS 負責穩定讀取)
    document.getElementById('fileUpload').addEventListener('change', function(e) {
        let file = e.target.files[0];
        if (!file) return;
        
        document.getElementById('fileName').innerText = `已選擇：${file.name}`;
        let reader = new FileReader();
        
        reader.onload = function(e) {
            try {
                let data = new Uint8Array(e.target.result);
                // 完美避開 ExcelJS 讀取 Bug
                let workbook = XLSX.read(data, {type: 'array'});
                sheetName = workbook.SheetNames[0];
                originalData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {defval: ""});
                
                document.getElementById('startBtn').disabled = false;
                log(`[系統] 檔案解析成功，共載入 ${originalData.length} 筆學生資料。`);
                log(`[系統] 等待執行批改指令...`);
            } catch (err) {
                log(`[錯誤] 檔案讀取失敗：${err.message}`);
            }
        };
        reader.readAsArrayBuffer(file);
    });

    // 執行批改程序
    document.getElementById('startBtn').addEventListener('click', async function() {
        if(GAS_WEB_APP_URL === "在此處貼上您的_GAS_應用程式網址" || GAS_WEB_APP_URL.trim() === "") {
            alert("系統錯誤：未設定後端中轉網址，請聯繫系統管理員更新原始碼中的 GAS_WEB_APP_URL。");
            return;
        }
        
        this.disabled = true;
        document.getElementById('downloadBtn').style.display = "none";
        log("[系統] 🚀 啟動智能批改引擎，執行嚴格資料脫敏程序...");

        for(let i = 0; i < originalData.length; i++) {
            let row = originalData[i];
            
            // ✨ 透過關鍵字模糊比對，精準抓取實際的欄位名稱
            let exactUsedAI = getExactKey(row, "有沒有使用任何生成式 AI 工具") || colUsedAI;
            let exactQ5 = getExactKey(row, "你使用了甚麼生成式 AI 工具") || colQ5;
            let exactQ6 = getExactKey(row, "哪些建議沒有採用") || colQ6;
            let exactQ7 = getExactKey(row, "採用了甚麼方法準備") || colQ7;
            let exactQ8 = getExactKey(row, "最具挑戰性") || colQ8;
            let exactQ9 = getExactKey(row, "為甚麼沒有尋求生成式 AI") || colQ9;
            let exactQ10 = getExactKey(row, "列舉兩個需要注意的事項") || colQ10;
            let exactQ11 = getExactKey(row, "將來會應用生成式 AI 協助語文學習") || colQ11;

            // 🔒 資料脫敏：只提取系統編號及作答內容
            let safeData = {
                id: row["Id"] || `未知ID_${i}`,
                usedAI: String(row[exactUsedAI] || "").trim(),
                q5: String(row[exactQ5] || "").trim(),
                q6: String(row[exactQ6] || "").trim(),
                q7: String(row[exactQ7] || "").trim(),
                q8: String(row[exactQ8] || "").trim(),
                q9: String(row[exactQ9] || "").trim(),
                q10: String(row[exactQ10] || "").trim(),
                q11: String(row[exactQ11] || "").trim()
            };

            log(`[處理中] 正在分析流水號 [${safeData.id}] 的作答內容...`);
            let prompt = buildPrompt(safeData);

            try {
                // 呼叫中轉站
                let response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ prompt: prompt })
                });
                let resultText = await response.text();
                let resultObj = JSON.parse(resultText);
                
                // 判斷邏輯分支，寫入成績與評語時對應真實欄位名稱
                let isPathA = (safeData.usedAI.includes("有"));
                if(isPathA) {
                    row[`Points - ${exactQ5}`] = resultObj.path_points;
                    row[`Feedback - ${exactQ5}`] = resultObj.path_feedback;
                } else {
                    row[`Points - ${exactQ7}`] = resultObj.path_points;
                    row[`Feedback - ${exactQ7}`] = resultObj.path_feedback;
                }
                
                row[`Points - ${exactQ10}`] = resultObj.common_points;
                row[`Feedback - ${exactQ10}`] = resultObj.common_feedback;

                // 總分計算
                let total = (resultObj.path_points || 0) + (resultObj.common_points || 0);
                row[`總分`] = total;

                log(`[完成] 流水號 [${safeData.id}] 批改完成。<br>
                <span style="color:#2ecc71;">&nbsp;&nbsp;↳ 路徑得分：${resultObj.path_points} | 共通得分：${resultObj.common_points} | </span><b style="color:#ff4757;">總分：${total}</b><br>
                <span style="color:#ff4757; font-size:12px;">&nbsp;&nbsp;↳ 評語預覽：${resultObj.path_feedback.substring(0, 35)}...</span>`, true);

            } catch (error) {
                log(`[錯誤] ❌ 流水號 [${safeData.id}] 發生異常：${error.message}`);
            }

            // 進度條更新
            let progressPercent = Math.round(((i + 1) / originalData.length) * 100);
            document.getElementById('progress').style.width = progressPercent + "%";
            document.getElementById('progressText').innerText = progressPercent + "%";
            
            // 延遲 1 秒，保護 API 不受頻率限制
            await new Promise(r => setTimeout(r, 1000));
        }

        log("<br><b>[系統] ✅ 所有試卷分析與評分程序執行完畢！</b>", true);
        document.getElementById('downloadBtn').style.display = "block";
        document.getElementById('startBtn').disabled = false;
        document.getElementById('startBtn').innerText = "🔄 重新批改";
    });

    // 匯出包含樣式的 Excel 檔案 (使用 ExcelJS 負責全新創建與上色)
    document.getElementById('downloadBtn').addEventListener('click', async function() {
        log("[系統] 正在封裝資料與紅色樣式格式，準備下載...", false);
        try {
            let wb = new ExcelJS.Workbook();
            let ws = wb.addWorksheet(sheetName);

            // 抓取所有現有欄位，確保總分排最後
            let headerSet = new Set();
            originalData.forEach(row => Object.keys(row).forEach(key => headerSet.add(key)));
            headerSet.delete('總分');
            let headers = Array.from(headerSet);
            headers.push('總分');

            // 寫入表頭 (粗體)
            let headerRow = ws.addRow(headers);
            headerRow.font = { bold: true };

            // 寫入資料行並判斷是否需要變換字體顏色
            originalData.forEach(rowData => {
                let rowValues = headers.map(h => rowData[h] !== undefined ? rowData[h] : "");
                let newRow = ws.addRow(rowValues);

                headers.forEach((h, colIndex) => {
                    let cell = newRow.getCell(colIndex + 1);
                    if (h.includes('Feedback')) {
                        cell.font = { color: { argb: 'FFFF0000' } }; // 紅字
                        cell.alignment = { wrapText: true, vertical: 'top' };
                        ws.getColumn(colIndex + 1).width = 40;
                    } else if (h === '總分') {
                        cell.font = { color: { argb: 'FFFF0000' }, bold: true }; // 紅色粗體
                    } else if (h.includes('Points')) {
                        cell.font = { bold: true };
                    }
                });
            });

            // 觸發下載
            const buffer = await wb.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "LAN3003_AI反思表_批改完成.xlsx";
            a.click();
            window.URL.revokeObjectURL(url);
            log("[系統] 📥 已成功下載批改結果檔案。", false);
        } catch (e) {
            log(`[錯誤] 下載失敗：${e.message}`);
        }
    });

    // 系統日誌列印器
    function log(msg, isHTML = false) {
        let logArea = document.getElementById('logArea');
        let div = document.createElement('div');
        div.style.marginBottom = "6px";
        if (isHTML) {
            div.innerHTML = msg;
        } else {
            div.innerText = msg;
        }
        logArea.appendChild(div);
        logArea.scrollTop = logArea.scrollHeight;
    }

    // AI 系統提示詞構建器
    function buildPrompt(data) {
        let isPathA = (data.usedAI === "有" || data.usedAI.includes("有"));
        let promptText = `你是一名香港的大學講師，正在批改「LAN3003職業中文傳意」的反思表。
【最高指導原則】你收到的是一份已脫敏的作答文本，系統代號為 ${data.id}。請直接根據評分標準給出回饋與分數，絕對不要試圖猜測學生身分，也不要生成任何涉及個人的問候語。

【作答內容】\n`;
        if (isPathA) {
            promptText += `學生表示「有」使用 AI。
第5題 (使用工具及協助方面)：${data.q5}
第6題 (採用/不採用建議及原因)：${data.q6}\n`;
        } else {
            promptText += `學生表示「沒有」使用 AI。
第7題 (準備方法)：${data.q7}
第8題 (挑戰)：${data.q8}
第9題 (為何沒用AI)：${data.q9}\n`;
        }
        promptText += `第10題 (兩項注意事項及原因)：${data.q10}
第11題 (未來應用例子)：${data.q11}\n
【評分標準】\n`;
        if (isPathA) {
            promptText += `路徑A (第5-6題，滿分5分)：
優/良(4-5分)：第5題寫出工具名稱並清晰交代協助方面(佔2分)；第6題各舉一「採用」及「不採用」建議並說明原因，原因須連繫本次情景(佔3分)。
尚可(2-3分)：未交代協助方面；第6題只答單面或原因空泛。
弱/不足(0-1分)：只寫工具名稱，或虛構/全部採用。\n`;
        } else {
            promptText += `路徑B (第7-9題，滿分5分)：
優/良(4-5分)：第7題列出具體做法(佔2分)；第9題根據第8題選項說明不尋求協助原因並連繫任務(佔3分)。
尚可(2-3分)：第7題空泛；第8與第9題邏輯不一致。
弱/不足(0-1分)：只寫「沒問題」等；或第7題與第9題互抄(互抄最多1分)。\n`;
        }
        promptText += `全體共通題 (第10-11題，滿分5分)：
優/良(4-5分)：第10題列出兩項注意事項、分別說明原因並連繫評核(佔3分)；第11題提出具體可執行做法且不重複(佔2分)。
尚可(2-3分)：第10題原因簡略；第11題空泛無步驟。
弱/不足(0-1分)：未能寫出注意事項；皆空泛。\n
【輸出要求】
請你「務必」只輸出純 JSON 格式，不要包含 \`\`\`json 標籤或其他文字。格式如下：
{
  "path_points": X,
  "path_feedback": "對於路徑的具體評語...",
  "common_points": Y,
  "common_feedback": "對於10-11題的具體評語..."
}\n`;
        return promptText;
    }
</script>

</body>
</html>
